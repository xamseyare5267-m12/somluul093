# Coturn sample — REPLACE listening-ip and external-ip with your server public IP.
# Generate user:
#   turnadmin -a -u somluul -p 'STRONG_PASSWORD' -r somluul
#
# Env for SomLuul API:
#   TURN_URL=turn:YOUR_IP:3478
#   TURN_USERNAME=somluul
#   TURN_CREDENTIAL=STRONG_PASSWORD

listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
realm=somluul
# listening-ip=0.0.0.0
# external-ip=YOUR.PUBLIC.IP
# relay-ip=YOUR.PUBLIC.IP

user=somluul:CHANGE_ME_STRONG_PASSWORD

no-cli
no-tls
no-dtls
# For production enable TLS with real certs and remove no-tls/no-dtls
